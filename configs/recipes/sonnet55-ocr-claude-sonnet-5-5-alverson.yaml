input:
  images: testdata/handwritten-notes-alverson-real-images
stages:
- id: images_to_manifest
  stage: extract
  module: images_dir_to_manifest_v1
  out: pages_images_manifest.jsonl
  params:
    input_dir: testdata/handwritten-notes-alverson-real-images
- id: ocr_ai
  stage: extract
  module: ocr_ai_gpt51_v1
  needs:
  - images_to_manifest
  inputs:
    pages: images_to_manifest
  out: pages_html.jsonl
  params:
    model: claude-sonnet-5-5
    max_long_side: 2048
    concurrency: 1
    skip_blank_pages: true
    ocr_hints: '- This page is handwritten historical correspondence or diary-style
      prose.

      - Preserve wording exactly as written, including misspellings, grammar, and
      punctuation.

      - Do not normalize names into more common spellings.

      - If a word is uncertain, prefer the most literal plausible reading over an
      invented confident substitution.

      - Use plain paragraph HTML unless stronger structure is explicitly visible.

      '
    max_output_tokens: 16384
