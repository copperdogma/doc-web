description: "Image crop extraction from scanned book pages \u2014 Onward to the Unknown"
prompts:
- id: file://../prompts/crop-conservative-count.js
  label: conservative-count
providers:
- id: python:../providers/mistral4_candidate.py
  label: Mistral Large4 strict integer crop schema
  config:
    model: mistralai/mistral-large-4-0
    expected_served_model: mistralai/mistral-large-4-0
    expected_served_provider: Mistral
    provider_route: mistral
    pin_provider: true
    require_parameters: true
    data_collection: null
    zdr: null
    output_contract: crop_regions_integer
    max_tokens: 4096
    maxRetries: 0
