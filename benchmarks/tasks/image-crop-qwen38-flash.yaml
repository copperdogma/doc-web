description: "Attempt 037 Qwen3.8 Flash force-fresh crop detector"
prompts:
  - id: file://../prompts/crop-conservative-count.js
    label: conservative-count
providers:
  - id: python:../providers/qwen38_flash_budgeted.py
    label: Qwen3.8 Flash Alibaba low
    config: &qwen_flash
      model: qwen/qwen3.8-flash
      expected_served_model: qwen/qwen3.8-flash
      expected_served_provider: Alibaba
      pin_provider: true
      require_parameters: true
      data_collection: null
      zdr: null
      reasoning_effort: low
      max_tokens: 16384
      output_contract: crop_regions
  - id: python:../providers/qwen38_flash_budgeted.py
    label: Qwen3.8 Flash Makora low
    config:
      <<: *qwen_flash
      expected_served_provider: Makora
