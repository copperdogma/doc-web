description: "Crop page-level deletion gate \u2014 validate maintained runtime crops\
  \ against source-page context"
prompts:
- id: file://../prompts/validate-page-level-crop.js
  label: page-context
providers:
- id: python:../providers/sonnet55_openai.py
  label: GPT5.5 maintained page safety
  config:
    model: gpt-5.5
    expected_served_model: gpt-5.5-2026-04-23
    reasoning_effort: none
    output_contract: page_context_validation
    max_output_tokens: 4096
tests:
- vars:
    page_image: file://../input/source-pages-b64/Image121.b64.txt
    crop_image: file://../input/crop-validation-b64/page-122-001.b64.txt
    crop_key: page-122-001
    golden_relpath: golden/crop-page-level-deletion-gate.json
  assert:
  - type: python
    value: file://../scorers/crop_validation_scorer.py
