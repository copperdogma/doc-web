description: "Image crop extraction from scanned book pages — Onward to the Unknown"

# Judge model for llm-rubric assertions
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-4-6

# Four prompt variants (JS functions adapt image format per provider)
prompts:
  - id: "file://../prompts/crop-baseline.js"
    label: "baseline"
  - id: "file://../prompts/crop-strict-exclude.js"
    label: "strict-exclude"
  - id: "file://../prompts/crop-two-step.js"
    label: "two-step"
  - id: "file://../prompts/crop-conservative-count.js"
    label: "conservative-count"

# Vision-capable models from all three providers
providers:
  # OpenAI — GPT-4.1 series (budget)
  - id: openai:chat:gpt-4.1-mini
    label: "GPT-4.1 Mini"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-4.1
    label: "GPT-4.1"
    config:
      temperature: 0
      max_tokens: 4096

  # OpenAI — GPT-5 series (frontier)
  - id: openai:chat:gpt-5-mini
    label: "GPT-5 Mini"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.4-mini
    label: "GPT-5.4 Mini"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.4-nano
    label: "GPT-5.4 Nano"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.5
    label: "GPT-5.5"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:responses:gpt-5.5
    label: "GPT-5.5 Responses"
    config:
      reasoning_effort: none
      max_output_tokens: 4096
  - id: openai:responses:gpt-5.5-pro
    label: "GPT-5.5 Pro Responses"
    config:
      reasoning_effort: medium
      verbosity: low
      max_output_tokens: 2048
  - id: openai:chat:gpt-5
    label: "GPT-5"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.1
    label: "GPT-5.1"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.2
    label: "GPT-5.2"
    config:
      temperature: 0
      max_tokens: 4096
  - id: openai:chat:gpt-5.3-chat-latest
    label: "GPT-5.3 Instant"
    config:
      temperature: 0
      max_tokens: 4096

  # Anthropic
  - id: anthropic:messages:claude-sonnet-4-5-20250929
    label: "Claude Sonnet 4.5"
    config:
      temperature: 0
      max_tokens: 4096
  - id: anthropic:messages:claude-opus-4-6
    label: "Claude Opus 4.6"
    config:
      temperature: 0
      max_tokens: 4096

  # OpenRouter — bounded public-fixture diagnostic only. Strict router
  # parameter enforcement is known to be unavailable for this endpoint, so
  # the generic provider retains and client-validates exact raw output before
  # any fence-only cleanup.
  - id: python:../providers/openrouter_vision_chat.py
    label: "Ox Alpha diagnostic (low reasoning, client-validated crop JSON)"
    config:
      model: stealth/ox-alpha
      expected_served_model: stealth/ox-alpha
      pin_provider: false
      require_parameters: false
      data_collection: null
      zdr: null
      reasoning_effort: low
      output_contract: crop_regions
      diagnostic_wrapper_cleanup: true
      diagnostic_raw_output_file: "ox-alpha-public-detector-float-20260825-{sha256}.json"
      max_tokens: 16384

  # Google — Gemini 2.5 series
  - id: google:gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    config:
      temperature: 0
      maxOutputTokens: 16384
  - id: google:gemini-2.5-pro
    label: "Gemini 2.5 Pro"
    config:
      temperature: 0
      maxOutputTokens: 16384

  # Google — Gemini 3 series
  - id: google:gemini-3-flash-preview
    label: "Gemini 3 Flash"
    config:
      temperature: 0
      maxOutputTokens: 16384
  - id: google:gemini-3-pro-preview
    label: "Gemini 3 Pro"
    config:
      temperature: 0
      maxOutputTokens: 16384
  - id: google:gemini-3.1-flash-lite
    label: "Gemini 3.1 Flash Lite"
    config:
      temperature: 0
      maxOutputTokens: 16384
  - id: google:gemini-3.5-flash-lite
    label: "Gemini 3.5 Flash-Lite (structured output)"
    config:
      maxOutputTokens: 16384
      responseSchema:
        type: object
        properties:
          images:
            type: array
            items:
              type: object
              properties:
                description:
                  type: string
                bbox:
                  type: array
                  description: "Exactly [x0, y0, x1, y1] as 0-1000 integers, with x0 < x1 and y0 < y1."
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1000
                  minItems: 4
                  maxItems: 4
              required: [description, bbox]
        required: [images]
  - id: google:gemini-3.7-flash
    label: "Gemini 3.7 Flash (structured output)"
    config:
      maxOutputTokens: 16384
      responseSchema:
        type: object
        properties:
          images:
            type: array
            items:
              type: object
              properties:
                description:
                  type: string
                bbox:
                  type: array
                  description: "Exactly [x0, y0, x1, y1] as 0-1000 integers, with x0 < x1 and y0 < y1."
                  items:
                    type: integer
                    minimum: 0
                    maximum: 1000
                  minItems: 4
                  maxItems: 4
              required: [description, bbox]
        required: [images]

# One test case per source image
tests:
  - vars:
      image: file://../input/source-pages-b64/Image000.b64.txt
      golden_key: "Image000"
    assert:
      - type: python
        value: file://../scorers/image_crop_scorer.py

