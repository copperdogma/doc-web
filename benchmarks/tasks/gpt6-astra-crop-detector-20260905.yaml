description: "GPT-6 Astra reasoning-effort calibration and maintained crop detector — 2026-09-05"

prompts:
  - id: "file://../prompts/crop-conservative-count.js"
    label: "conservative-count"

providers:
  - id: python:../providers/openai_responses_model.py
    label: "GPT-6 Astra low"
    config:
      model: gpt-6-astra
      expected_served_model: gpt-6-astra
      reasoning_effort: low
      max_output_tokens: 4096
      image_detail: high
      output_contract: crop_regions
