- id: google:gemini-3.7-flash
  label: "Gemini 3.7 Flash (low thinking, strict crop-verdict schema)"
  config:
    maxOutputTokens: 4096
    generationConfig:
      thinkingConfig:
        thinkingLevel: low
    responseSchema:
      type: object
      properties:
        verdict:
          type: string
          enum: [pass, fail]
        has_page_text:
          type: boolean
        excessive_blank:
          type: boolean
        reason:
          type: string
      required: [verdict, has_page_text, excessive_blank, reason]
