module_id: extract_pdf_images_fast_v1
stage: extract
entrypoint: modules/extract/extract_pdf_images_fast_v1/main.py
input_schema: null
output_schema: page_image_v1
description: "Fast decoded extraction of full-page embedded PDF images, with rendering fallback and lossless PNG output (TIFF for native CMYK)."
params:
  - name: start
    type: int
    default: 1
  - name: end
    type: int
    default: null
  - name: fallback_to_render
    type: bool
    default: true
  - name: fallback_dpi
    type: int
    default: 300
  - name: target_line_height
    type: int
    default: 24
  - name: baseline_dpi
    type: int
    default: 72
  - name: sample_count
    type: int
    default: 5
  - name: normalize
    type: bool
    default: true
  - name: out
    type: str
    default: pages_rendered_manifest.jsonl
  - name: report
    type: str
    default: extraction_report.jsonl
notes: "Attempts to extract embedded full-page images from PDF XObject streams. Falls back to pdf2image rendering when necessary. Native and normalized outputs use lossless PNG, or TIFF to preserve CMYK channels without color conversion. Raster sampling and optional OCR normalization remain separate quality decisions."
